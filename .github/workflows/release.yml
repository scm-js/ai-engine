# A v* tag becomes a GitHub release with the packed package attached. The server installs
# the package from that tarball's URL, so the tag must match package.json's version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version." >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" scm-js-ai-engine-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
